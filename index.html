<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prescription Panic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <h1>Prescription Panic</h1>
    <p class="subtitle">A 2D pharmacy simulation game</p>

    <div class="game-wrapper">
      <canvas id="gameCanvas" width="1000" height="620"></canvas>
    </div>

    <div class="controls">
      <p><strong>Move:</strong> Arrow Keys / WASD</p>
      <p><strong>Pick medicine:</strong> Touch a shelf</p>
      <p><strong>Deliver:</strong> Touch the correct patient</p>
      <p><strong>Start / Restart:</strong> Enter</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
